<circle cx="1069" cy="343" r="5" fill="#9a6f2f" stroke="#ffffff" stroke-width="1.5"/>
<text x="30" y="409.0" font-size="12" fill="#16161a">Three surfaces we did not build, and cannot see. Each family carries its own.</text>
<text x="30" y="427.0" font-size="12" fill="#74747e">The same six places sit in the same relative positions on every one of them. That is the thing being inferred.</text>
<rect x="30" y="471.0" width="1160" height="150" rx="8" fill="#f4f4f5" stroke="#e2e2e6"/>
<text x="46" y="497.0" font-size="13" fill="#16161a" font-weight="bold">The chart: ours, published, and small</text>
<text x="46" y="517.0" font-size="11" fill="#74747e">45 statements, a 32-syllable codebook, an axis order derived over 204 places, and one hashing rule. 3,300 bytes.</text>
<text x="46" y="543.0" font-size="12" fill="#16161a">The chart does not create the positions. It gives them names, an order, and a way to prove which one you are standing on.</text>
<text x="46" y="563.0" font-size="12" fill="#74747e">Hand two cartographers the same grid and they label the same mountain the same way. That agreement is only worth something because the mountain was there first.</text>
<text x="46" y="589.0" font-size="11.5" fill="#9a6f2f">Where it stops: the chart is shared too, but only when the states are unambiguous. Ambiguous states send the charts apart again, which is why the six places here are described in plain, concrete English.</text>
<text x="46" y="609.0" font-size="11" fill="#74747e">This is the parent project's finding, restated: the manifold is shared, and the chart is shared when the situations are clear. It is inferred from agreement, not observed directly.</text>
<line x1="30" y1="631.0" x2="1190" y2="631.0" stroke="#e2e2e6"/>
<text x="30" y="655.0" font-size="15" fill="#16161a" font-weight="bold">What the numbers do and do not license</text>
<rect x="30" y="667.0" width="96" height="22" rx="11" fill="#3f6b52" opacity="0.12" stroke="#3f6b52"/>
<text x="42" y="683.0" font-size="10.5" fill="#3f6b52" font-weight="bold">SHOWN</text>
<text x="142" y="683.0" font-size="12" fill="#16161a">Independent systems with separate lineage place the same situation in the same part of their own space, and state it i</text>
<rect x="30" y="701.0" width="96" height="22" rx="11" fill="#3a4a6b" opacity="0.12" stroke="#3a4a6b"/>
<text x="42" y="717.0" font-size="10.5" fill="#3a4a6b" font-weight="bold">IMPLIED</text>
<text x="142" y="717.0" font-size="12" fill="#16161a">Situations have a structure that independently trained systems share. The primer charts it rather than inventing it.</text>
<rect x="30" y="735.0" width="96" height="22" rx="11" fill="#9a6f2f" opacity="0.12" stroke="#9a6f2f"/>
<text x="42" y="751.0" font-size="10.5" fill="#9a6f2f" font-weight="bold">NOT SHOWN</text>
<text x="142" y="751.0" font-size="12" fill="#16161a">That any of this is meaning. A coordinate is a description of a position, and a shared position is not a shared unders</text>
</svg>
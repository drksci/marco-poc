<text x="620" y="572" font-size="11.5" fill="#6b6b6b" text-anchor="middle">axes read (1 hex digit each) &#8594; sharper</text>
<text x="30" y="592" font-size="12" fill="#6b6b6b">Coarse reading is not a failure: it is the honest answer "somewhere in this region". The address never claims more precision than has been read.</text>

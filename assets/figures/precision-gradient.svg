<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<rect width="1240" height="700" fill="#ffffff"/>
<text x="30" y="56" font-size="24" fill="#111111" font-family="Georgia, serif">One address, many precisions</text>
<text x="30" y="80" font-size="13.5" fill="#6b6b6b">You do not have to read the whole thing. Stop early and you have a region; keep going and</text>
<text x="30" y="97" font-size="13.5" fill="#6b6b6b">you have a room. Every step narrows. No step contradicts the one before it.</text>
<text x="30" y="128" font-size="13" fill="#6b6b6b" letter-spacing="1">B &#183; THE SAME PLACE, READ AT SIX PRECISIONS</text>
<text x="30" y="146" font-size="12" fill="#6b6b6b">kitchen with friend &#8212; 18 of 45 statements true</text>
<text x="30" y="175" font-size="11.5" fill="#6b6b6b"> 1 axes</text>
<text x="110" y="175" font-size="14" fill="#111111">⌁ ma</text>
<text x="910" y="175" font-size="11.5" fill="#6b6b6b">1 hex digits</text>
<text x="30" y="199" font-size="11.5" fill="#6b6b6b"> 2 axes</text>
<text x="110" y="199" font-size="14" fill="#111111">⌁ ma</text>
<text x="910" y="199" font-size="11.5" fill="#6b6b6b">2 hex digits</text>
<text x="30" y="223" font-size="11.5" fill="#6b6b6b"> 4 axes</text>
<text x="110" y="223" font-size="14" fill="#111111">⌁ ma.ma</text>
<text x="910" y="223" font-size="11.5" fill="#6b6b6b">4 hex digits</text>
<text x="30" y="247" font-size="11.5" fill="#6b6b6b"> 6 axes</text>
<text x="110" y="247" font-size="14" fill="#111111">⌁ ma.mo.ma</text>
<text x="910" y="247" font-size="11.5" fill="#6b6b6b">6 hex digits</text>
<text x="30" y="271" font-size="11.5" fill="#6b6b6b">12 axes</text>
<text x="110" y="271" font-size="14" fill="#111111">⌁ ma.mo.ma.ma.su</text>
<text x="910" y="271" font-size="11.5" fill="#6b6b6b">12 hex digits</text>
<text x="30" y="295" font-size="11.5" fill="#6b6b6b">45 axes</text>
<text x="110" y="295" font-size="14" fill="#111111">⌁ ma.mo.ma.ma.ru·ma.me.ki.va.ki+ve.ki.va.tu.ru~ki.ru.ki</text>
<text x="910" y="295" font-size="11.5" fill="#6b6b6b">45 hex digits</text>
<text x="30" y="318" font-size="13" fill="#6b6b6b" letter-spacing="1">A &#183; HOW MANY PLACES STILL LOOK THE SAME</text>

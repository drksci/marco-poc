<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1236" width="1180" height="1236" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<rect width="1180" height="1236" fill="#ffffff"/>
<text x="30" y="54" font-size="23" fill="#16161a" font-family="Georgia, serif">The unroll ladder</text>
<text x="30" y="78" font-size="12.5" fill="#74747e">Left: what is derived from what. Right: the artefact that stage produces, printed from the real seed.</text>
<text x="30" y="98" font-size="12.5" fill="#74747e">3,300 bytes in, 67,561 bytes of frame reconstructed, 20.47x, and none of the derived part is ever sent.</text>
<rect x="30" y="126" width="330" height="74" rx="6" fill="#f4f4f5" stroke="#e2e2e6"/>
<circle cx="52" cy="148" r="12" fill="#16161a"/>
<text x="52" y="152" font-size="11.5" fill="#ffffff" text-anchor="middle">1</text>
<text x="74" y="153" font-size="14" fill="#16161a" font-weight="bold">the seed</text>
<text x="74" y="171" font-size="10.5" fill="#74747e">primer.seed.json</text>
<text x="74" y="188" font-size="10.5" fill="#74747e">3,300 bytes. No situations, no questions, no axis order.</text>
<rect x="400" y="126" width="750" height="74" rx="6" fill="#ffffff" stroke="#e2e2e6"/>
<text x="416" y="152" font-size="12" fill="#16161a">primer_version, landmarks, phonology, markers, distance,</text>
<text x="416" y="168" font-size="12" fill="#16161a">hierarchy, partition, similarity, population</text>
<path d="M 52 202 L 52 213" stroke="#e2e2e6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="216" width="330" height="74" rx="6" fill="#f4f4f5" stroke="#e2e2e6"/>
<circle cx="52" cy="238" r="12" fill="#16161a"/>
<text x="52" y="242" font-size="11.5" fill="#ffffff" text-anchor="middle">2</text>
<text x="74" y="243" font-size="14" fill="#16161a" font-weight="bold">landmarks</text>
<text x="74" y="261" font-size="10.5" fill="#74747e">namespace &gt; relation &gt; values</text>
<text x="74" y="278" font-size="10.5" fill="#74747e">45 statements, each with its plain reading inside the seed.</text>
<rect x="400" y="216" width="750" height="74" rx="6" fill="#ffffff" stroke="#e2e2e6"/>
<text x="416" y="242" font-size="12" fill="#16161a">see/this_place/inside  see/this_place/outside  see/people/any</text>
<text x="416" y="258" font-size="12" fill="#16161a">  ... and 42 more</text>
<path d="M 52 292 L 52 303" stroke="#e2e2e6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="306" width="330" height="74" rx="6" fill="#f4f4f5" stroke="#e2e2e6"/>
<circle cx="52" cy="328" r="12" fill="#16161a"/>
<text x="52" y="332" font-size="11.5" fill="#ffffff" text-anchor="middle">3</text>
<text x="74" y="333" font-size="14" fill="#16161a" font-weight="bold">codebook</text>
<text x="74" y="351" font-size="10.5" fill="#74747e">boustrophedon walk over 6 consonants x 5 vowels</text>
<text x="74" y="368" font-size="10.5" fill="#74747e">32 syllables. Adjacent entries differ by exactly one phoneme: 31 of 31.</text>
<rect x="400" y="306" width="750" height="74" rx="6" fill="#ffffff" stroke="#e2e2e6"/>
<text x="416" y="332" font-size="12" fill="#16161a">ma  me  mi  mo  mu  nu  no  ni  ne  na  ka  ke  ki  ko  ku  tu  to  ti  te  ta  sa  se  si  so  su  ru  </text>
<path d="M 52 382 L 52 393" stroke="#e2e2e6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="396" width="330" height="74" rx="6" fill="#f4f4f5" stroke="#e2e2e6"/>
<circle cx="52" cy="418" r="12" fill="#16161a"/>
<text x="52" y="422" font-size="11.5" fill="#ffffff" text-anchor="middle">4</text>
<text x="74" y="423" font-size="14" fill="#16161a" font-weight="bold">certainty ladder</text>
<text x="74" y="441" font-size="10.5" fill="#74747e">5 rungs, weakest wins</text>
<text x="74" y="458" font-size="10.5" fill="#74747e">Only = and |- may anchor a claim. Confidence cannot promote a marker.</text>
<rect x="400" y="396" width="750" height="74" rx="6" fill="#ffffff" stroke="#e2e2e6"/>
<text x="416" y="422" font-size="10.5" fill="#16161a">= 5  ⊢ 4  ≈ 3  ~ 2  ? 1</text>
<path d="M 52 472 L 52 483" stroke="#e2e2e6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="486" width="330" height="74" rx="6" fill="#f4f4f5" stroke="#e2e2e6"/>
<circle cx="52" cy="508" r="12" fill="#16161a"/>
<text x="52" y="512" font-size="11.5" fill="#ffffff" text-anchor="middle">5</text>
<text x="74" y="513" font-size="14" fill="#16161a" font-weight="bold">metric</text>
<text x="74" y="531" font-size="10.5" fill="#74747e">distance to each landmark</text>
<text x="74" y="548" font-size="10.5" fill="#74747e">Four levels, so quantisation keeps 0.0 distinct from 0.3.</text>
<rect x="400" y="486" width="750" height="74" rx="6" fill="#ffffff" stroke="#e2e2e6"/>
<text x="416" y="512" font-size="10.5" fill="#16161a">same_thing 0.0  same_group_same_subject 0.3  same_group_other_subject 0.6  different_group 0.9</text>
<path d="M 52 562 L 52 573" stroke="#e2e2e6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="576" width="330" height="74" rx="6" fill="#f4f4f5" stroke="#e2e2e6"/>
<circle cx="52" cy="598" r="12" fill="#16161a"/>
<text x="52" y="602" font-size="11.5" fill="#ffffff" text-anchor="middle">6</text>
<text x="74" y="603" font-size="14" fill="#16161a" font-weight="bold">population</text>
<text x="74" y="621" font-size="10.5" fill="#74747e">derived, depth 1</text>
<text x="74" y="638" font-size="10.5" fill="#74747e">204 concrete places. The only data the primer needs.</text>
<rect x="400" y="576" width="750" height="74" rx="6" fill="#ffffff" stroke="#e2e2e6"/>
<text x="416" y="602" font-size="10.5" fill="#16161a">the 6 shipped places, plus every place one answer away</text>
<path d="M 52 652 L 52 663" stroke="#e2e2e6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="666" width="330" height="74" rx="6" fill="#f4f4f5" stroke="#e2e2e6"/>
<circle cx="52" cy="688" r="12" fill="#16161a"/>
<text x="52" y="692" font-size="11.5" fill="#ffffff" text-anchor="middle">7</text>
<text x="74" y="693" font-size="14" fill="#16161a" font-weight="bold">axis order</text>
<text x="74" y="711" font-size="10.5" fill="#74747e">descending variance over that population</text>
<text x="74" y="728" font-size="10.5" fill="#74747e">Not stored. Recovered identically on both sides. This is what a registry w</text>
<rect x="400" y="666" width="750" height="74" rx="6" fill="#ffffff" stroke="#e2e2e6"/>
<text x="416" y="692" font-size="10.5" fill="#16161a">first ten axes  [36, 35, 38, 30, 29, 3, 26, 23, 12, 41]</text>
<text x="416" y="708" font-size="10.5" fill="#16161a">most important  #36  know/why_im_here/any</text>
<path d="M 52 742 L 52 753" stroke="#e2e2e6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="756" width="330" height="74" rx="6" fill="#f4f4f5" stroke="#e2e2e6"/>
<circle cx="52" cy="778" r="12" fill="#16161a"/>
<text x="52" y="782" font-size="11.5" fill="#ffffff" text-anchor="middle">8</text>
<text x="74" y="783" font-size="14" fill="#16161a" font-weight="bold">seal</text>
<text x="74" y="801" font-size="10.5" fill="#74747e">SHA-256 over the whole frame</text>
<text x="74" y="818" font-size="10.5" fill="#74747e">Two sides compare this before comparing anything else.</text>
<rect x="400" y="756" width="750" height="74" rx="6" fill="#ffffff" stroke="#e2e2e6"/>
<text x="416" y="782" font-size="10.5" fill="#16161a">df2f8b9972c40bfdd132366a58b4780f65f23feba1ef20a0</text>
<text x="416" y="798" font-size="10.5" fill="#16161a">60c25d4eff2661ba</text>
<line x1="30" y1="844" x2="1150" y2="844" stroke="#e2e2e6"/>
<text x="30" y="868" font-size="13" fill="#74747e">and now one place: kitchen_with_friend, 18 statements reported</text>
<rect x="30" y="880" width="560" height="96" rx="6" fill="#eaf0eb" stroke="#3f6b52"/>
<text x="46" y="904" font-size="12" fill="#3f6b52" font-weight="bold">THE ADDRESS - says near</text>
<text x="46" y="928" font-size="14" fill="#16161a">⌁ ma.mo.ma.ma.ru·ma.me.ki.va.ki+ve.ki.va.tu.ru~ki.ru.ki</text>
<text x="46" y="948" font-size="14" fill="#16161a"></text>
<text x="46" y="966" font-size="10.5" fill="#74747e">similar places read alike. proves nothing.</text>
<rect x="610" y="880" width="540" height="96" rx="6" fill="#f8f2e6" stroke="#9a6f2f"/>
<text x="626" y="904" font-size="12" fill="#9a6f2f" font-weight="bold">THE ROOT - says same</text>
<text x="626" y="926" font-size="10.5" fill="#16161a">9baed0357835e37553f90f0546a848d1cc177e7972829258e844</text>
<text x="626" y="942" font-size="10.5" fill="#16161a">78140a38b9a8</text>
<text x="626" y="966" font-size="10.5" fill="#74747e">one statement different, unrelated root. says nothing about nearness.</text>
<line x1="30" y1="1006" x2="1150" y2="1006" stroke="#e2e2e6"/>
<text x="30" y="1028" font-size="13" fill="#16161a" font-weight="bold">And then what they are used for</text>
<rect x="30" y="1040" width="270" height="92" rx="6" fill="#ffffff" stroke="#e2e2e6"/>
<text x="44" y="1062" font-size="13" fill="#16161a" font-weight="bold">compare</text>
<text x="44" y="1080" font-size="10.5" fill="#74747e">two addresses, one number</text>
<text x="44" y="1100" font-size="10.5" fill="#16161a">HAMMING(address, address) -&gt; how</text>
<text x="44" y="1114" font-size="10.5" fill="#16161a">close. No third party, no lookup.</text>
<rect x="314" y="1040" width="270" height="92" rx="6" fill="#ffffff" stroke="#e2e2e6"/>
<text x="328" y="1062" font-size="13" fill="#16161a" font-weight="bold">refine</text>
<text x="328" y="1080" font-size="10.5" fill="#74747e">stop wherever it matters</text>
<text x="328" y="1100" font-size="10.5" fill="#16161a">1 axis gives 3 groups from 6</text>
<text x="328" y="1114" font-size="10.5" fill="#16161a">places; 6 axes names them all.</text>
<rect x="597" y="1040" width="270" height="92" rx="6" fill="#ffffff" stroke="#e2e2e6"/>
<text x="611" y="1062" font-size="13" fill="#16161a" font-weight="bold">verify</text>
<text x="611" y="1080" font-size="10.5" fill="#74747e">rebuild it yourself</text>
<text x="611" y="1100" font-size="10.5" fill="#16161a">recompute the root from the</text>
<text x="611" y="1114" font-size="10.5" fill="#16161a">statements. Equal or not equal.</text>
<rect x="880" y="1040" width="270" height="92" rx="6" fill="#ffffff" stroke="#e2e2e6"/>
<text x="894" y="1062" font-size="13" fill="#16161a" font-weight="bold">discover</text>
<text x="894" y="1080" font-size="10.5" fill="#74747e">find by situation, not by name</text>
<text x="894" y="1100" font-size="10.5" fill="#16161a">path recall 1/4, nearness recall</text>
<text x="894" y="1114" font-size="10.5" fill="#16161a">4/4, with no mapping table.</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e2e2e6"/></marker></defs>
</svg>
<text x="40" y="821" font-size="10.5" fill="#9a6f2f" font-weight="bold">THE ANSWERS DIFFER</text>
<text x="194" y="821" font-size="11.5" fill="#16161a">The frame is not shared, and the claim on this site is wrong. That is a result too, and worth re</text>

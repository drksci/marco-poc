<text x="40" y="855" font-size="10.5" fill="#74747e" font-weight="bold">THE FIRST FEW AGREE</text>
<text x="194" y="855" font-size="11.5" fill="#16161a">The outside of an address is the coarse part. Agreement there means the region matches even when</text>
<text x="28" y="918" font-size="11" fill="#74747e">The expected answer for the library room is a set of eight numbers. It is recorded in the repository so you can check whether your two assistants found it.</text>

<text x="40" y="787" font-size="10.5" fill="#3f6b52" font-weight="bold">THE ANSWERS AGREE</text>
<text x="194" y="787" font-size="11.5" fill="#16161a">Two systems that share no weights, no context and no contact placed the same room in the same pa</text>
